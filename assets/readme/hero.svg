<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Salesforce Renames — an Open Knowledge Format v0.2 bundle</title>
  <desc id="hero-desc">A knowledge bundle tracking Salesforce product and certification renames, with a real timeline example: salesforce.com (SFDC) in 2000, renamed to Sales Cloud in 2009, renamed to Agentforce Sales in 2025.</desc>

  <rect width="1200" height="340" rx="24" fill="#0B0D10"/>

  <g id="title-block" transform="translate(56 54)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2" fill="#8B9199">OPEN KNOWLEDGE FORMAT v0.2 · KNOWLEDGE BUNDLE</text>

    <text x="0" y="66" font-size="54" font-weight="700" fill="#F4F1EA">SALESFORCE</text>
    <text x="0" y="128" font-size="54" font-weight="700" fill="#F4F1EA">RENAMES</text>

    <text x="0" y="176" font-size="22" fill="#D8D4C9">What changed, when, and what to do about it —</text>
    <text x="0" y="206" font-size="22" fill="#D8D4C9">built for your agent to check, not just you.</text>

    <text x="0" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#8B9199">132 concepts · certs + products · renames.jsonl</text>
  </g>

  <g id="proof-timeline" transform="translate(600 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="15" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="1.5" fill="#8B9199">REAL EXAMPLE — products/sales-cloud.md</text>

    <line x1="15" y1="180" x2="510" y2="180" stroke="#3A3D42" stroke-width="2"/>

    <circle cx="15" cy="180" r="7" fill="#F4F1EA"/>
    <text x="15" y="150" font-size="18" font-weight="600" fill="#F4F1EA">salesforce.com</text>
    <text x="15" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B9199">2000 (SFDC)</text>

    <path d="M 145 180 L 118 174 L 118 186 Z" fill="#E8833A"/>

    <circle cx="260" cy="180" r="7" fill="#F4F1EA"/>
    <text x="260" y="150" font-size="18" font-weight="600" fill="#F4F1EA" text-anchor="middle">Sales Cloud</text>
    <text x="260" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B9199" text-anchor="middle">2009</text>

    <path d="M 393 180 L 366 174 L 366 186 Z" fill="#E8833A"/>

    <circle cx="510" cy="180" r="7" fill="#4CAF7D"/>
    <text x="510" y="150" font-size="18" font-weight="700" fill="#4CAF7D" text-anchor="end">Agentforce Sales</text>
    <text x="510" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B9199" text-anchor="end">2025 – now</text>

    <text x="15" y="264" font-size="16" fill="#6B7076">2 renames since 2000, independently corroborated.</text>
  </g>
</svg>
